<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Type your title here</title>
    <!-- Bootstrap Styles-->
    <link rel="stylesheet" href="resources/styles/bootstrap.min.css">
    <link rel="stylesheet" href="resources/styles/styles.css" />
</head>

<body>
    <div class="container">
        <!-- WORK FROM INSIDE THIS CONTAINER-->
        <h1>Rock Paper Scissors</h1>

        <div id="welcome-screen">
            <form id="name-form">
                <div>
                    <label for="username">Your Name.</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter Name Here...." 
                    />
                    <button type="submit" id="start-game-button" class="btn btn-primary">Start Game!</button>
                </div>
            </form>
        </div>

        <div id="game-screen">
            <div id="score-tally">
                <p id="score">User: 0 v CPU: 0</p>
            </div>

            <form id="game-form">
                <div>
                    <label for="user-selection">Select your choice</label>
                    <select id="user-selection" name="user-selection" class="custom-select">
                        <option>Rock</option>
                        <option>Paper</option>
                        <option>Scissors</option>
                    </select>
                    <button type="submit" id="go-button" class="btn btn-success">Go!</button>
                </div>
            </form>

            <p id="game-history"></p>
        </div>
    </div>

    <!-- Our own Scripts -->
    <script src="resources/scripts/rock_paper_scissors.js"></script>
    <script src="resources/scripts/index.js"></script>
</body>

</html>
